name: price-tracker

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: price
      POSTGRES_PASSWORD: price
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price -d price_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: core
    env_file: [.env]
    environment:
      # Inside the compose network the services are reached by name, which
      # overrides the localhost values a developer keeps in .env.
      POSTGRES_DSN: postgres://price:price@postgres:5432/price_tracker?sslmode=disable
      REDIS_ADDR: redis:6379
      CORE_GRPC_LISTEN: ":9090"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: bot
    env_file: [.env]
    environment:
      CORE_GRPC_ADDR: core:9090
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
