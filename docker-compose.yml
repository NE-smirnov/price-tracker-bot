name: price-tracker

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: price
      POSTGRES_PASSWORD: price
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data under /var/lib/postgresql/<major>/docker; mount
      # the parent directory, not .../data (see docker-library/postgres#1259).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price -d price_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://price:price@postgres:5432/price_tracker?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: core
    env_file: [.env]
    environment:
      # Inside the compose network the services are reached by name, which
      # overrides the localhost values a developer keeps in .env.
      POSTGRES_DSN: postgres://price:price@postgres:5432/price_tracker?sslmode=disable
      REDIS_ADDR: redis:6379
      CORE_GRPC_LISTEN: ":9090"
    ports:
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: bot
    env_file: [.env]
    environment:
      CORE_GRPC_ADDR: core:9090
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_started
    restart: unless-stopped

  currency:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: currency
    env_file: [.env]
    environment:
      REDIS_ADDR: redis:6379
      CURRENCY_GRPC_LISTEN: ":9091"
    ports:
      - "9091:9091"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: scraper
    env_file: [.env]
    environment:
      CORE_GRPC_ADDR: core:9090
      CURRENCY_GRPC_ADDR: currency:9091
      REDIS_ADDR: redis:6379
    depends_on:
      core:
        condition: service_started
      currency:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: notifier
    env_file: [.env]
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
