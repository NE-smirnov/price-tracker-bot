name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"

jobs:
  lint:
    name: format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt check
        run: |
          out="$(gofmt -l $(git ls-files '*.go' | grep -v '^internal/gen/'))"
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: go.mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: test
    runs-on: ubuntu-latest

    # The repository layer is mostly SQL (leases with SKIP LOCKED, ON CONFLICT
    # dedup, one-transaction alert decisions), so CI runs a real PostgreSQL
    # rather than mocking the parts most likely to break.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: price
          POSTGRES_PASSWORD: price
          POSTGRES_DB: price_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://price:price@localhost:5432/price_tracker_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # -p 1 because the database tests share one schema and reset it per test.
      - run: go test -race -count=1 -p 1 -covermode=atomic -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  build:
    name: build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Extend this list as services land: scraper, notifier.
        service: [bot, core, currency, scraper, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: CGO_ENABLED=0 go build -trimpath -o bin/${{ matrix.service }} ./cmd/${{ matrix.service }}
