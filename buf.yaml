version: v2

modules:
  - path: api/proto

lint:
  use:
    - STANDARD
  except:
    # Our RPC request/response messages are shared across a service rather than
    # named per method, which is what this rule insists on.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE

breaking:
  use:
    - FILE
